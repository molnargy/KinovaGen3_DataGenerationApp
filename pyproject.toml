[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kinova-movement-app"
version = "0.1.0"
description = "A Python application for Kinova movement projects."
readme = "README.md"
requires-python = ">=3.10"

[project.scripts]
kinova-movement-app = "kinova_movement_app.main:main"

[tool.setuptools.packages.find]
where = ["src"]
